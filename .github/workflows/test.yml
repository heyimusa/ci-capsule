name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.7'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/ci-capsule
      - name: Build hardened container image
        run: docker build --pull --tag ci-capsule:ci .
      - name: Smoke-test the container without network or write access
        run: |
          set -euo pipefail
          test "$(docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 64 --memory 128m --cpus 1 --user 65532:65532 ci-capsule:ci --version)" = "dev"
